packages:
  - packages/*
  - tooling/*
  # Apps (the examples and the docs site): private, never published, and nothing depends on one (tooling/lint holds
  # both).
  - apps/*

# Every version is exact: a range could resolve a release younger than minimumReleaseAge, and the
# packages publish with these pins. The intl entries are the versions the packages were last verified
# against. Bump an entry deliberately, in its own PR.
catalog:
  # Workspace tooling.
  "@changesets/cli": 3.0.3
  # First-party lint plugins (`@elmeragroup/internal/oxlint*`); bump with the exclude entry below.
  "@elmeragroup/internal": 0.2.0-canary.22
  # The version @elmeragroup/internal brings, so one copy installs.
  "@oxlint/plugins": 1.93.0
  "@types/node": 26.6.5
  # The manifest test's parsers for the JSONC and YAML configs it checks.
  jsonc-parser: 3.3.1
  yaml: 2.9.1
  eslint-plugin-turbo: 2.11.10
  oxfmt: 0.78.0
  oxlint: 1.93.0
  turbo: 2.11.10
  vitest: 5.0.5
  jsdom: 29.1.1
  # tsrs runs every type-check, declaration emit and the type-aware lint rules (tsrs-lint). It pins
  # TypeScript 7.1-beta semantics; typescript stays installed for tsdown and the frameworks' own
  # type generation. Bump both together.
  tsrs: 0.25.0-ts7.1.0-beta
  typescript: 7.0.2
  tsdown: 0.23.1
  # The Effect language service's type-checker and lint rules: `effect-tsgo` runs an Effect-patched tsrs and oxlint
  # binding. Each release supports exact tsrs and oxlint versions (its README's table); 0.70.0 supports the tsrs and
  # oxlint pins above. Bump with tsrs and oxlint, and update tooling/typescript/effect.json's rules and
  # .oxlintrc.effect.json with it.
  "@effect/tsgo": 0.70.0

  # Runtime dependencies of @elmeragroup/intl and @elmeragroup/intl-tools. oxc-parser and
  # oxc-transform ship together; bump in lockstep.
  "@jridgewell/trace-mapping": 0.3.31
  "@schummar/icu-type-parser": 1.27.2
  intl-messageformat: 12.1.5
  oxc-parser: 0.158.0
  oxc-transform: 0.158.0
  # A dependency of @elmeragroup/intl-tools (its PO codec) and the optional peer of `@elmeragroup/intl/effect`; the
  # version @elmeragroup/internal pins, so one copy installs. It is also the peer range's floor: the version we promise
  # is the version we test.
  effect: 4.1.3
  # effect's Node platform services (the CLI's Stdio): released with effect and pinned to the same version. Never
  # @effect/platform-node, whose required redis peer auto-installs 15 MB and which adds undici.
  "@effect/platform-node-shared": 4.1.3
  # effect's Vitest integration (it.effect, TestClock), released with effect and pinned to the same version. The tools'
  # watch tests drive its debounce and poll on the test clock.
  "@effect/vitest": 4.1.3

  # Host frameworks: the adapters' peers, and the e2e fixture apps that run on them. @next/mdx and @mdx-js/loader also
  # compile the docs site's MDX pages.
  "@mdx-js/loader": 3.1.1
  # Keep in lockstep with next.
  "@next/mdx": 16.4.6
  "@playwright/test": 1.64.1
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-start": 1.169.3
  "@vitejs/plugin-react": 5.2.0
  next: 16.4.6
  nitro: 3.0.260903-beta
  rolldown: 1.2.13
  vite: 8.3.4

  # The example apps' and the docs site's UI: Elmera's Fuse design system and its app-shell block, at the versions Fuse's own docs app
  # (commit 9be80460) builds the block with. Fuse's data tables take @tanstack/react-table as a peer; tailwindcss and
  # @tailwindcss/postcss build its stylesheet through Next's PostCSS, @tailwindcss/vite through the Start example's Vite.
  # Bump the three Tailwind entries together.
  "@elmeragroup/fuse": 0.1.0-canary.208
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-table": 9.2.4
  tailwindcss: 4.3.3
  # The host examples' boundary parser: each parses the settings a client posts with one schema. The version the
  # lockfile already held (TanStack Start's), so one copy installs.
  zod: 4.6.7
  # The docs site's face, Latin files self-hosted: next/font/local loads its WOFF2s into the pages and the Open Graph
  # images read its WOFFs, so neither a build nor a request fetches a font. SIL OFL 1.1, its license shipped beside the
  # files.
  "@fontsource/inter": 5.3.0
  # The Effect example's Node listener: Node's request as a Fetch Request (its abort signal included) for effect's
  # HttpEffect.toWebHandler. The version the lockfile already held (h3's and nitro's), so one copy installs.
  srvx: 1.0.8

catalogs:
  react19:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.1
    react-dom: 19.3.1
  # The lowest version of each peer the published packages declare, and of each companion that must move with one:
  # every range is `^floor` (or `>=floor <next major>`), with its floor here (the manifest test holds both). No package
  # takes these; `scripts/peer-floors.ts` puts each in place of the same name above, and merge.yml's floors job runs the
  # packages' unit tests and the fixture e2e (@elmeragroup/intl-e2e) on them. Change one only with a run on it
  # (CONTRIBUTING.md, Peer ranges).
  floors:
    # The router's floor. @tanstack/react-start pins its router exactly, and 1.168.0 is the release that ships 1.170.0.
    "@tanstack/react-router": 1.170.0
    "@tanstack/react-start": 1.168.0
    # effect's floor, and the platform and test packages released with it. Equal to the catalog today; listed so the
    # job keeps installing the floor after a catalog bump.
    "@effect/platform-node-shared": 4.1.3
    "@effect/vitest": 4.1.3
    effect: 4.1.3
    # In lockstep with next, as in the catalog.
    "@next/mdx": 16.4.0
    next: 16.4.0
    # React's floor, react-dom with it; @types/react stays at the catalog's.
    react: 19.0.0
    react-dom: 19.0.0
    # The first Vite on which the tools' build-watch tests pass (#96): on 8.0 a watch misses rebuilds, on 8.1 it reports
    # extra changes to the project directory after a missing config is created.
    vite: 8.2.0
    # The optional peer's floor: the first Vitest 5, with the cache-key hook the catalog plugin registers.
    vitest: 5.0.0

autoInstallPeers: true

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  sharp: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  # Canary line of the in-house tooling package; bump this exact entry with the catalog pin.
  - "@elmeragroup/internal@0.2.0-canary.22"
