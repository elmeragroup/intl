name: Version Packages

# Called by merge.yml after the checks and e2e jobs pass on a push to main. Opens or updates the
# changeset-release/main PR that turns the pending changesets into the next stable version.
on:
  workflow_call:

# queue: max keeps every pending run, so the run for main's newest head is never displaced; older runs
# skip at the head check below.
concurrency:
  group: version-packages
  cancel-in-progress: false
  queue: max

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      # A later push to main supersedes this run; only the current head updates the PR. A failed lookup
      # fails the job (set -e on the assignment, and an empty result), never a silent skip.
      - name: Check for a superseded main commit
        id: current
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          LISTED=$(git ls-remote --exit-code origin refs/heads/main)
          MAIN_COMMIT=${LISTED%%[[:space:]]*}
          if [ -z "$MAIN_COMMIT" ]; then
            echo "::error::git ls-remote returned no commit for main"
            exit 1
          fi
          if [ "$SOURCE_COMMIT" = "$MAIN_COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: $SOURCE_COMMIT is not main's head ($MAIN_COMMIT)"
          fi

      # Writes bump=true when the changesets bump the fixed group (major, minor or patch).
      - name: Plan
        id: plan
        if: steps.current.outputs.current == 'true'
        run: node scripts/release.ts plan "$GITHUB_OUTPUT"

      # With no bump left (the last pending change was reverted), the action exits without touching an
      # open release PR (src/index.ts at the pinned SHA returns early when there are no changesets), and
      # that PR could still merge a changelog for the reverted change. The action's branch is
      # changeset-release/<base branch>, looked up as head <owner>:<branch> with base main (src/run.ts).
      # gh's --head takes no owner, so a fork's branch of that name matches too; isCrossRepository
      # == false keeps only this repository's branch.
      - name: Close a release PR with nothing to release
        if: steps.current.outputs.current == 'true' && steps.plan.outputs.bump == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          OPEN=$(gh pr list --head changeset-release/main --base main --state open --json number,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .number')
          for NUMBER in $OPEN; do
            gh pr close "$NUMBER" --comment "Closed by the Version Packages workflow: main has no pending changeset that bumps a version, so there is nothing to release. A new release PR opens with the next changeset."
          done

      # The PR's checks are not dispatched: a workflow_dispatch run's checks do not appear on the PR and
      # do not satisfy required checks. The opened/synchronize events this GITHUB_TOKEN causes create
      # the PR's pull_request runs (Merge, PR title) in an approval-required state, which a maintainer
      # approves on the PR (CONTRIBUTING.md#releases).
      - name: Version Packages PR
        if: steps.current.outputs.current == 'true' && steps.plan.outputs.bump == 'true'
        # Runs only with a bump, so the action never opens a PR for `none`-only changesets (which it
        # otherwise versions) and Changesets CLI v3 is never asked to version an empty release (which
        # exits 1). No publish-script: publishing runs in publish-release.yml, the only job in the npm
        # environment.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm release:version
          pr-title: Version Packages
          commit-message: "chore: version packages"
          github-token: ${{ github.token }}
