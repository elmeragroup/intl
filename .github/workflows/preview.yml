name: Preview

# Each pull request gets one live revision of the docs site (apps/docs) on the preview Container App, labelled
# `pr-<n>`, so its URL (`<app>---pr-<n>.<environment domain>`) stays the same across pushes. A push replaces the
# revision; closing the PR, merged or not, deactivates it. Preview URLs resolve only on the VPN. The app's base hostname
# serves a placeholder that answers 404 (apps/docs/placeholder), never a PR's code. Production is not set up.
#
# A PR that leaves the docs site unchanged can carry the `no-preview` label; its pushes then deploy nothing. A revision
# deployed before the label stays live until the PR closes.
#
# This must stay `pull_request`, never `pull_request_target`: the repo is public, and `pull_request_target` would hand
# the preview identity to code from any fork. Fork PRs get no OIDC token under `pull_request`, so they are skipped
# with a note instead, and every job that reaches Azure runs only for a PR from this repository. The preview
# identity's federated credential trusts only `pull_request` runs, so no scheduled job could clean up either.
#
# Three commits, each for one purpose:
#
# - The automation (.github: the scripts and the push action) comes from `github.workflow_sha`, the commit this
#   workflow file was read from, so the scripts always match the workflow that calls them, even on a PR branched before
#   they existed.
# - The preview is the PR's head commit (`pull_request.head.sha`), not the test merge commit `github.sha` names: GitHub
#   computes that merge lazily and moves it when the base branch moves, so it cannot say whether a run is still current.
#   The docs image is built and tagged from the head, and the live gate (.github/scripts/docs-preview-gate.sh) compares
#   it with the PR's head as GitHub reports it now. A head without the docs app deploys nothing.
# - The placeholder image, the app's default route, is built from the PR's base commit (`pull_request.base.sha`, the
#   protected branch), so a PR's code never becomes it.
#
# Every PR shares the one app, and each label or traffic change rewrites its whole traffic list, so every change to it
# runs in one job, `azure`, one run at a time across all PRs: one concurrency group with `queue: max`, which keeps every
# waiting run in order (up to 100) instead of cancelling all but the newest, so no teardown is dropped. Image builds run
# in parallel outside it, one group per PR and commit, so a rerun of an old commit never cancels a newer build. A queued
# run can wait while the PR moves on, and a rerun replays its original event, so the live gate runs before the build,
# at the start of the `azure` job, and before every attempt to write the PR's label.
#
# GitHub runs no pull_request workflow for a PR with merge conflicts, so a PR that closes conflicted gets no teardown.
# Every `azure` run therefore ends with a reconcile (docs-container-app.sh): labels of PRs GitHub reports closed are
# removed, the triggering PR's included, and every active revision no label points at is deactivated, a failed
# deploy's candidate among them.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

env:
  APP: ${{ vars.PREVIEW_CONTAINER_APP }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PREVIEW }}
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # Marks the one preview comment this workflow creates and then edits in place, with the author it is posted as.
  COMMENT_MARKER: "<!-- intl-docs-preview -->"
  COMMENT_AUTHOR: github-actions[bot]

jobs:
  fork:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the skipped preview
        run: |
          {
            echo "### No preview for fork pull requests"
            echo "Forks receive no Azure OIDC token under \`pull_request\`, so this PR cannot deploy a preview."
            echo "A maintainer can push the branch to $GITHUB_REPOSITORY to get one."
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds and pushes the PR's image, and the placeholder when the app has no bootstrap revision to reactivate. Nothing
  # here changes the app. `image` is set only when an image was pushed for the `azure` job to deploy, and `origin` is
  # the preview URL baked into it, which the deploy reports.
  build:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AZURE_CLIENT_ID_PREVIEW != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: intl-docs-preview-build-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      origin: ${{ steps.origin.outputs.origin }}
      bootstrap-image: ${{ steps.bootstrap.outputs.image }}
    steps:
      - name: Checkout the automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github
          persist-credentials: false

      - name: Read the PR as it is now
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/docs-preview-gate.sh deploy

      - name: Checkout the PR head
        if: steps.gate.outputs.act == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Find the docs app
        id: app
        if: steps.gate.outputs.act == 'true'
        run: |
          if [[ -f head/apps/docs/Dockerfile ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No docs preview"
              echo "This PR's head has no \`apps/docs/Dockerfile\`: it branched before the docs site, so there is nothing to preview."
              echo "Rebase it on the base branch to get one."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Azure login
        if: steps.app.outputs.present == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PREVIEW }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PREVIEW }}

      # The build bakes the preview's label URL into its og:image URLs, so read it first. A bare assignment keeps a
      # failed lookup fatal; inside `echo` its status would be lost.
      - name: Preview origin
        id: origin
        if: steps.app.outputs.present == 'true'
        env:
          ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_PREVIEW }}
        run: |
          origin="$(bash .github/scripts/docs-container-app.sh origin-preview)"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Probe the bootstrap revision
        id: probe
        if: steps.app.outputs.present == 'true'
        run: |
          probe="$(bash .github/scripts/docs-container-app.sh probe)"
          echo "$probe" >> "$GITHUB_OUTPUT"

      # The tag names the run as well as the commit, so a rerun's image is told apart from the first's; the deploy
      # names the digest.
      - name: Push image
        id: image
        if: steps.app.outputs.present == 'true'
        uses: ./.github/actions/push-docs-image
        with:
          registry: ${{ vars.AZURE_ACR_NAME_PREVIEW }}
          tag: ${{ format('{0}-{1}-{2}', github.event.pull_request.head.sha, github.run_id, github.run_attempt) }}
          context: head
          file: head/apps/docs/Dockerfile
          build-args: |
            DOCS_ORIGIN=${{ steps.origin.outputs.origin }}
          cache-scope: intl-docs

      # Only when the app has no bootstrap revision, active or not: the `azure` job recreates it from this image. An
      # inactive one is reactivated instead.
      - name: Checkout the PR base
        if: steps.probe.outputs.placeholder == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: apps/docs/placeholder
          persist-credentials: false

      - name: Find the placeholder
        if: steps.probe.outputs.placeholder == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! -f base/apps/docs/placeholder/Dockerfile ]]; then
            echo "::error::The preview app has no bootstrap revision, and the PR's base ($BASE_SHA) has no apps/docs/placeholder to build it from. Merge the placeholder to the base branch first."
            exit 1
          fi

      # The environment pulls only from the preview registry, so the placeholder lives there too.
      - name: Push placeholder
        id: bootstrap
        if: steps.probe.outputs.placeholder == 'true'
        uses: ./.github/actions/push-docs-image
        with:
          registry: ${{ vars.AZURE_ACR_NAME_PREVIEW }}
          tag: ${{ format('bootstrap-{0}-{1}-{2}', github.event.pull_request.base.sha, github.run_id, github.run_attempt) }}
          context: base/apps/docs/placeholder
          file: base/apps/docs/placeholder/Dockerfile
          cache-scope: intl-docs-placeholder

  # Every change to the preview app: the deploy of a built image or, on close, the teardown, then the reconcile, under one
  # lock across all PRs. A closed event skips `build`, so the job runs on `!cancelled()` and names its own condition.
  azure:
    needs: build
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AZURE_CLIENT_ID_PREVIEW != '' &&
      (github.event.action == 'closed' || needs.build.outputs.image != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: intl-docs-preview-azure
      queue: max
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      MODE: ${{ github.event.action == 'closed' && 'teardown' || 'deploy' }}
    steps:
      - name: Checkout the automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github
          persist-credentials: false

      # Its turn may come long after the event: a run the PR has moved past stops here, before logging in.
      - name: Read the PR as it is now
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/docs-preview-gate.sh "$MODE"

      - name: Azure login
        id: login
        if: steps.gate.outputs.act == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PREVIEW }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PREVIEW }}

      # Deploy: waits until Azure reports the new revision ready (the runner is not on the VPN, so it cannot request
      # the preview), then moves the PR's label to it. Teardown: removes the PR's label. Reports `outcome` (deployed,
      # removed, nothing or skipped), and on a deploy `url` (the origin the build baked in) and `revision` as soon as
      # the label is written, with no Azure read in between.
      - name: Change the preview
        id: change
        if: steps.login.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          ORIGIN: ${{ needs.build.outputs.origin }}
          BOOTSTRAP_IMAGE: ${{ needs.build.outputs.bootstrap-image }}
          ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_PREVIEW }}
          REGISTRY: ${{ vars.AZURE_ACR_NAME_PREVIEW }}
          MANAGED_IDENTITY_ID: ${{ vars.AZURE_MANAGED_IDENTITY_ID_PREVIEW }}
          # Run ID also changes on reopen, even if the head is unchanged.
          SUFFIX: ${{ format('pr-{0}-{1}-{2}', github.event.pull_request.number, github.run_id, github.run_attempt) }}
        run: bash .github/scripts/docs-container-app.sh "$MODE"

      - name: Update the preview comment
        if: >-
          !cancelled() &&
          (steps.change.outputs.outcome == 'deployed' || steps.change.outputs.outcome == 'removed' ||
          steps.change.outputs.outcome == 'nothing')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ steps.change.outputs.outcome }}
          URL: ${{ steps.change.outputs.url }}
          REVISION: ${{ steps.change.outputs.revision }}
        with:
          script: |
            const { OUTCOME, URL, REVISION, HEAD_SHA, COMMENT_MARKER, COMMENT_AUTHOR } = process.env;
            const status = {
              deployed: `${URL} (VPN only)\n\nBuilt from ${HEAD_SHA.slice(0, 7)} as revision \`${REVISION}\`. The revision is removed when this PR closes.`,
              removed: "removed when this PR closed.",
              nothing: "none is running for this closed PR.",
            }[OUTCOME];
            const body = `${COMMENT_MARKER}\n**Docs preview:** ${status}`;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(
              (comment) => comment.user?.login === COMMENT_AUTHOR && comment.body?.startsWith(COMMENT_MARKER)
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (OUTCOME === "deployed") {
              await github.rest.issues.createComment({ ...issue, body });
            }

      # Runs whatever the change step and the comment did, so a failed deploy's leftover revision is cleaned up too; a
      # failure here fails the job without touching the outcome or the comment above.
      - name: Reconcile the app
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/docs-container-app.sh reconcile
