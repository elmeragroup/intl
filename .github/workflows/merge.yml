name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs dependency code on every PR and push, so the token is read-only. The release jobs
# declare their own permissions, which replace this default for that job.
permissions:
  contents: read

jobs:
  # Format, lint, type-check and every package's ci:checks (its type-check and unit, conformance,
  # differential, fuzz, public-surface and bundle-boundary tests). CONTRIBUTING.md#verification
  # names what each gate proves.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changeset status --since reads the base branch's history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      # setup-node already provides the devEngines.runtime pin, so pnpm skips downloading it again.
      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Check workspace
        run: pnpm ci:checks
        env:
          TURBO_RUN_SUMMARY: "true"

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

  # The fixture apps (Next.js and TanStack Start) built and served on the workspace-linked packages,
  # then on their packed archives installed as real copies, with the Playwright gates over each
  # pass. A job of its own, so a unit or type failure does not wait on the builds.
  e2e:
    runs-on: ubuntu-latest
    # The e2e scripts build the fixture apps and the example apps and start their servers; a hung server would
    # otherwise hold the runner for GitHub's 360-minute default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium webkit

      - name: turbo e2e
        run: pnpm test:e2e
        env:
          TURBO_RUN_SUMMARY: "true"

      # Traces, screenshots and the HTML report of a red run, for diagnosis without a rerun.
      - name: Upload Playwright output
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/*/test-results/
            packages/*/playwright-report/
            apps/*/test-results/
            apps/*/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The bottom of every declared peer range: the packages' unit tests and the fixture gate (@elmeragroup/intl-e2e: its
  # linked and packed passes over the Next and Start fixtures) on the `floors` catalog of pnpm-workspace.yaml (the
  # lowest Next, Vite, Vitest, router, React and Effect the manifests accept), after scripts/peer-floors.ts put each in
  # place of its catalog entry and checked every package resolved it. The effect example's unit tests run too, because
  # its Vitest config registers @elmeragroup/intl-tools/vitest, so Vitest itself loads and calls the public global
  # setup on the floor (the setup's own tests call it by hand). The other jobs test the top of each range on the
  # catalog's versions; the manifest test holds the ranges to both. What it does not prove: the example apps' specs are
  # not run (they show the recommended setup on the catalog's versions); the Next fixture renders Next's vendored
  # React, so React 19.0.0 is carried by the Start fixture and the runtime's unit tests; and the install is unlocked,
  # so a transitive dependency can drift from one run to the next. #112 tracks that and the other gaps: no type-check
  # against the floors' declarations (@types/react stays at the catalog's), and no peer check beyond direct copies.
  floors:
    runs-on: ubuntu-latest
    # The fixture builds and servers of the e2e job, on older versions.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      # Rewrites the catalog and the lockfile in this disposable checkout, then installs unlocked.
      - name: Install the peer floors
        run: node scripts/peer-floors.ts --no-runtime

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium webkit

      - name: Unit tests on the floors
        run: >-
          pnpm turbo run test:run --filter=@elmeragroup/intl --filter=@elmeragroup/intl-tools
          --filter=@elmeragroup/effect-example
        env:
          TURBO_RUN_SUMMARY: "true"

      - name: Fixture e2e on the floors
        run: pnpm turbo run e2e --filter=@elmeragroup/intl-e2e
        env:
          TURBO_RUN_SUMMARY: "true"

      - name: Upload Playwright output
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-floors-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/*/test-results/
            packages/*/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Canary or stable publication of the checked commit (CONTRIBUTING.md#releases). npm's trusted
  # publishing validates the calling workflow's filename for a workflow_call, so the npm entries name
  # merge.yml. The called workflow cannot hold more than this grant.
  release:
    needs: [checks, e2e, floors]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml

  version:
    needs: [checks, e2e, floors]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/version-packages.yml
